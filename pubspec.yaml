name: gce_boys_hostel
description: "Production-ready mobile application for GCE Boys Hostel management and attendance."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # State Management & Architecture
  provider: ^6.1.2

  # Utilities & UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

  # Local Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  sqflite_common_ffi_web: ^1.1.3
  sqflite_common_ffi: ^2.4.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
